name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest

strategy:
  fail-fast: false
  matrix:
    include:
      - arch: Win32
        suffix: x86

      - arch: x64
        suffix: x64

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup MSVC
    uses: ilammy/msvc-dev-cmd@v1

  - name: Configure
    run: |
      cmake -B build -A ${{ matrix.arch }}

  - name: Build
    run: |
      cmake --build build --config Release

  - name: Package
    shell: pwsh
    run: |
      $version = "${{ github.ref_name }}"

      New-Item -ItemType Directory `
        -Force `
        -Path package | Out-Null

      Copy-Item build/bin/Release/vermouth.dll package/
      Copy-Item README.md package/
      Copy-Item LICENSE package/

      Compress-Archive `
        -Path package/* `
        -DestinationPath "vermouth-$version-${{ matrix.suffix }}.zip"

  - name: Upload Artifact
    uses: actions/upload-artifact@v4
    with:
      name: vermouth-${{ matrix.suffix }}
      path: vermouth-${{ github.ref_name }}-${{ matrix.suffix }}.zip

release:
  name: Publish Release
  runs-on: windows-latest
  needs: build

steps:
  - name: Download Artifacts
    uses: actions/download-artifact@v4
    with:
      path: artifacts

  - name: Create GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      generate_release_notes: true
      files: |
        artifacts/vermouth-x86/*.zip
        artifacts/vermouth-x64/*.zip
